name: Document CAPTCHA sections in all post flows

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add CAPTCHA comments
        shell: python
        run: |
          from pathlib import Path

          def add(path, marker, comment):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if comment not in s:
                  if marker not in s: raise SystemExit(f'Missing marker: {path}: {marker}')
                  s=s.replace(marker, comment+'\n'+marker, 1); p.write_text(s, encoding='utf-8')

          common = '''    /* CAPTCHA COMMENT — ALL POST FLOWS / ALL PLATFORMS
       Supported post platforms: Craigslist, AdLandPro, ClassifiedAds, Facebook
       Marketplace, OfferUp, Mercari, Poshmark, and Nextdoor. CAPTCHA is a
       third-party human/anti-abuse checkpoint. This code only records, displays,
       and routes a user-controlled checkpoint; it must never solve, bypass,
       replay, predict, or defeat the challenge. Runtime CAPTCHA answers are
       transient and must not be persisted with campaign/account data. */'''
          add('seller-workspace.html','    let captchaRequiredJobs = new Set();',common)
          add('seller-workspace.html','    function registerCaptchaInputHandler(jobIndex, handler) {','''    /* CAPTCHA INPUT BOUNDARY
       Each platform/account/location may register its own handler. Only the
       value personally entered by the user belongs here. Keep it separate from
       any optional CAPTCHA-service credential and never log the answer. */''')
          add('seller-workspace.html','    function getCaptchaScreenshotMarkup(job) {','''    /* CAPTCHA SCREENSHOT CONTEXT
       Images/screenshots only show where the human checkpoint is located. Do
       not add image interpretation or automated challenge-solving logic here. */''')
          add('seller-workspace.html','    function renderCaptchaNotifications() {','''    /* CAPTCHA NOTIFICATION CENTER
       Shared by every post platform and account. A notification is not proof
       of completion and must not advance a job by itself. */''')
          add('seller-workspace.html','    function submitCaptchaFromNotification(jobIndex) {','''    /* USER-PROVIDED CAPTCHA HANDOFF
       Forward only the current human-entered value to its exact job handler,
       then clear the transient UI field. Never persist or share it. */''')
          add('seller-workspace.html',"    function setCaptchaRequired(jobIndex, required = true, reason = 'CAPTCHA input required') {",'''    /* CAPTCHA GATE
       Platform adapters call this when a human checkpoint appears/disappears.
       It changes workflow state only; it does not click, solve, or bypass CAPTCHA. */''')
          add('seller-workspace.html','    async function launchPost() {','''    /* POST LAUNCH / CAPTCHA POLICY
       Queue launch never means CAPTCHA automation is allowed. Client-only jobs
       stop for the platform human check; service credentials remain distinct. */''')
          add('seller-workspace.html','    function startNextJob() {','''    /* QUEUE ADVANCEMENT / CAPTCHA SAFETY
       Never mark a CAPTCHA-gated job complete because a browser opened or a
       notification appeared. Wait for the platform/user-confirmed next state. */''')
          add('seller-workspace.html','    async function beginClassifiedAdsJobFlow(jobIndex) {','''    /* CLASSIFIEDADS CAPTCHA SECTION
       CAPTCHA remains inside the Android emulator's user-controlled browser
       session. The workspace records the gate but never solves or bypasses it. */''')
          add('seller-workspace.html','    function renderClientListingPanel(job) {','''    /* CLIENT CAPTCHA DISPLAY — ALL PLATFORMS
       This is a human handoff surface, not a solver. Keep platform CAPTCHA
       interaction inside the correct origin/account/session. */''')
          add('seller-workspace.html','    function markClientJobPosted(jobIndex) {','''    /* CAPTCHA COMPLETION CHECKPOINT
       Do not infer success from time, screenshots, page appearance, or clicks.
       Posted status requires explicit platform/user confirmation. */''')
          add('seller-workspace.html','    async function submitJobToServer(job, captchaKey) {','''    /* SERVER CAPTCHA CREDENTIAL BOUNDARY
       `captchaKey` is a configured service credential, not the user's CAPTCHA
       answer. Never expose, store, or transform challenge answers here. */''')
          add('seller-workspace.html','    function platformSessionMarkup(platform) {','''    /* PLATFORM CAPTCHA ISOLATION
       CAPTCHA belongs to the exact platform/account/location session. Never
       route a Craigslist challenge into another platform's posting session. */''')

          add('classifiedads.js',"    captcha: ['input[name=\"captchacode\"'] ,",'''    /* CLASSIFIEDADS CAPTCHA SELECTORS
       Selector discovery only. Never use these selectors to solve, bypass,
       replay, or defeat the site's human checkpoint. */''')
          add('classifiedads.js',"  function submitGuestPost(root, { confirmPublish = false, termsAccepted = null } = {}) {",'''  /* CAPTCHA-TO-PUBLISH BOUNDARY
     The runtime CAPTCHA value must come from the user's active platform session.
     This adapter contains no CAPTCHA solver and does not persist the answer. */''')
          add('classifiedads.js',"  async function runGuestPostFlow({ root = document, product, category = 'Items for Sale', subcategory = 'Collectibles', location = 'Charleston, SC', contact = {}, captcha, prepareImages = true, confirmPublish = false } = {}) {",'''  /* CLASSIFIEDADS GUEST FLOW / CAPTCHA STAGE
     Human checkpoint occurs after form/contact preparation and before terms /
     publish. `captcha` is user-provided and transient. */''')
          add('classifiedads.js',"    log.push({ step: 'captcha', result: { selector: firstMatch(root, SELECTORS.captcha).selector, entered: true } });",'''    // CAPTCHA COMMENT: record only that the user supplied a runtime value;
    // never log or persist the CAPTCHA text itself.''')
          add('classifiedads.js',"    { step: 7, action: 'fillRuntimeCaptcha', url: GUEST_FLOW_URLS.form, validate: 'form', selector: 'captcha', userProvided: true },",'''    // CAPTCHA COMMENT: this step documents the user-controlled human checkpoint;
    // it is not a CAPTCHA-solving operation.''')
          add('classifiedads.js','  async function runGuestPostLocationSessions({ product, sessions = [], ...options } = {}) {','''  /* CLASSIFIEDADS MULTI-LOCATION CAPTCHA
     Each location session may receive an independent challenge. Never share a
     CAPTCHA response between locations or assume one session authorizes another. */''')

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/document-captcha-comments.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seller-workspace.html classifiedads.js .github/workflows/document-captcha-comments.yml
          git commit -m "Add detailed CAPTCHA comments to all post flows"
          git push
