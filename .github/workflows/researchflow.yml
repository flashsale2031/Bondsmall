name: ResearchFlow Mission Integrity

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC. Times are intentionally off the hour.
    - cron: '15 1 * * *'
    - cron: '15 2 * * *'
    - cron: '0 3,9,15,21 * * *'
    - cron: '15 4 * * *'
    - cron: '15 5 * * 1'
    - cron: '15 6 * * 1'
    - cron: '15 5 * * 3'
    - cron: '15 7 1 * *'

permissions:
  contents: read

jobs:
  researchflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ResearchFlow
        run: node researchflow.js --scan > researchflow-report.json

      - name: Upload ResearchFlow report
        uses: actions/upload-artifact@v4
        with:
          name: researchflow-report-${{ github.run_number }}
          path: researchflow-report.json
          retention-days: 14
