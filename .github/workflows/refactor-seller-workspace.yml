name: Seller Workspace Externalization
on:
  push:
    paths:
      - .github/workflows/refactor-seller-workspace.yml
      - .github/scripts/refactor-seller-workspace.py
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Externalize Seller workspace
        run: python3 .github/scripts/refactor-seller-workspace.py
      - name: Commit generated Seller pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seller.html seller-workspace.html
          git diff --cached --quiet && exit 0
          git commit -m "Externalize Seller workspace into framed page"
          git push
