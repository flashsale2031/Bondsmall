name: Normalize gold coin product photography

on:
  push:
    branches: [main]
    paths:
      - products.js
      - gold-coin-assets.py
      - .github/workflows/normalize-gold-coins.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[gold-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Bonds Mall catalog sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            products.js
            gold-coin-assets.py
            assets/american-liberty-lion-gold-2026
            assets/gold-coins
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check --no-input pillow cairosvg

      - name: Generate local white-background gold coin assets
        run: python gold-coin-assets.py


      - name: Verify gold coin runtime imagery is repository-local
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          text = Path("products.js").read_text(encoding="utf-8")
          products = json.loads(text[text.find("["):text.rfind("]") + 1])
          gold = [
              p for p in products if isinstance(p, dict) and (
                  "gold coin" in str(p.get("name", "")).lower()
                  or (str(p.get("category", "")).lower() == "artandcollectibles" and "gold" in str(p.get("name", "")).lower())
              )
          ]
          external = []
          incomplete = []
          for p in gold:
              values = [p.get("image")] + list(p.get("images") or [])
              if any(isinstance(v, str) and re.match(r"^https?://", v) for v in values):
                  external.append(p.get("id"))
              if not p.get("image") or len(p.get("images") or []) < 5:
                  incomplete.append(p.get("id"))
          if external:
              raise SystemExit(f"Gold coin products still reference external runtime imagery: {external}")
          if incomplete:
              print(f"Gold coin products without five local views (no verified source photography): {incomplete}")
          print(f"Verified {len(gold)} gold coin products: runtime imagery is same-origin/local where available.")
          PY

      - name: Commit generated assets and localized catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.js assets/gold-coins
          if git diff --cached --quiet; then
            echo "No gold-coin asset changes to commit."
            exit 0
          fi
          git commit -m "chore: localize gold coin product photography [gold-assets]"
          git push
