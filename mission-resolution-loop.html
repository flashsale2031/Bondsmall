<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonds Mall Mission Resolution Loop</title><style>body{margin:0;background:#07120d;color:#eef8f0;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.step{padding:14px;border:1px solid #294632;border-radius:10px;background:#102018}.active{border-color:#71c28a;box-shadow:0 0 0 1px #71c28a inset}pre{white-space:pre-wrap;background:#0b1711;padding:14px;border-radius:10px;max-height:500px;overflow:auto}button{padding:10px 14px;border:1px solid #42664d;background:#183522;color:white;border-radius:8px}</style></head><body><main><h1>Mission Problem → Research → Resolution → Revision</h1><p>Every detected mission problem receives a research record, a programmatic resolution candidate, a complete mission-data render gate, consolidation research across uploaded code, and a unified mission-revision candidate.</p><div class="flow" id="flow"></div><p><button id="refresh">Refresh</button></p><pre id="state"></pre></main><script src="mission-resolution-loop.js"></script><script>(function(){const L=window.BondsMallMissionResolutionLoop,flow=document.getElementById('flow'),out=document.getElementById('state');function render(){const s=L.getState();flow.innerHTML=L.stages.map((x,i)=>'<div class="step '+(s.status===x?'active':'')+'"><b>'+(i+1)+'. '+x+'</b></div>').join('');out.textContent=JSON.stringify(s,null,2)}document.getElementById('refresh').onclick=render;window.addEventListener('bonds:mission-resolution-loop',render);render();})();</script></body></html>
