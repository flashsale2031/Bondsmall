<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bonds Mall — Seller Dashboard</title>
  <meta name="theme-color" content="#06080f">
  <link rel="icon" type="image/svg+xml" href="seller-logo.svg">
  <link rel="shortcut icon" href="seller-logo.svg">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #06080f; }
    body { font-family: Inter, Arial, sans-serif; color: #f0f2f5; overflow: hidden; }
    .seller-shell { height: 100vh; display: flex; flex-direction: column; }
    .seller-brand { height: 76px; flex: 0 0 76px; display: flex; align-items: center; gap: 14px; padding: 10px 24px; background: #0d1117; border-bottom: 1px solid rgba(255,255,255,.08); box-shadow: 0 4px 18px rgba(0,0,0,.25); }
    .seller-brand img { width: 54px; height: 54px; object-fit: contain; }
    .seller-brand-text { display: flex; flex-direction: column; gap: 2px; }
    .seller-brand-name { font-size: 1.15rem; font-weight: 800; letter-spacing: 2px; }
    .seller-brand-subtitle { font-size: .72rem; color: #8b95a5; letter-spacing: .7px; text-transform: uppercase; }
    .seller-workspace { width: 100%; flex: 1 1 auto; min-height: 0; border: 0; display: block; background: #06080f; }
    @media (max-width: 600px) {
      .seller-brand { height: 64px; flex-basis: 64px; padding: 7px 14px; gap: 10px; }
      .seller-brand img { width: 44px; height: 44px; }
      .seller-brand-name { font-size: 1rem; }
      .seller-brand-subtitle { font-size: .62rem; }
    }
  </style>
</head>
<body>
  <div class="seller-shell">
    <header class="seller-brand">
      <img src="seller-logo.svg" alt="Seller logo">
      <div class="seller-brand-text">
        <div class="seller-brand-name">SELLER</div>
        <div class="seller-brand-subtitle">Bonds Mall Seller Dashboard</div>
      </div>
    </header>
    <iframe class="seller-workspace" src="seller-workspace.html" title="Seller Workspace"></iframe>
  </div>
</body>
</html>
