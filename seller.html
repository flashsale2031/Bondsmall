<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bonds Mall — Seller Dashboard</title>
  <meta name="description"
    content="CLBlast dashboard for managing classified ad postings across Craigslist, AdLandPro, and ClassifiedAds.com. View live ads, analytics, manage products, and link accounts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════════════
       DESIGN SYSTEM
     ═══════════════════════════════════════════════════════════ */
    :root {
      --bg: #06080f;
      --bg2: #0d1117;
      --card: rgba(17, 24, 39, 0.7);
      --card-hover: rgba(24, 33, 50, 0.85);
      --glass: rgba(255, 255, 255, 0.04);
      --glass2: rgba(255, 255, 255, 0.08);

      --text: #f0f2f5;
      --text2: #8b95a5;
      --muted: #4a5568;
      --accent: #e94560;

      --cl: #a855f7;
      --cl-glow: rgba(168, 85, 247, 0.25);
      --ap: #3b82f6;
      --ap-glow: rgba(59, 130, 246, 0.25);
      --ca: #f59e0b;
      --ca-glow: rgba(245, 158, 11, 0.25);

      --green: #10b981;
      --red: #ef4444;
      --border: rgba(255, 255, 255, 0.06);
      --border2: rgba(255, 255, 255, 0.12);

      --grad-accent: linear-gradient(135deg, #e94560, #c32148);
      --grad-header: linear-gradient(135deg, #0d1117 0%, #131a28 50%, #0f1722 100%);
      --grad-success: linear-gradient(135deg, #059669, #10b981);
      --grad-danger: linear-gradient(135deg, #dc2626, #ef4444);

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
      --shadow-glow-cl: 0 0 20px rgba(168, 85, 247, 0.15);
      --shadow-glow-ap: 0 0 20px rgba(59, 130, 246, 0.15);
      --shadow-glow-ca: 0 0 20px rgba(245, 158, 11, 0.15);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 50px;

      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Keyframes ─────────────────────────────────────────── */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes pulse-glow {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% center
      }

      100% {
        background-position: 200% center
      }
    }

    @keyframes live-dot {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, .6)
      }

      50% {
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0)
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* ── Reset ─────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(168, 85, 247, .04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(59, 130, 246, .04) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(245, 158, 11, .03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ══════════════════════════════════════════════════════════
       SERVER OFFLINE BANNER
    ══════════════════════════════════════════════════════════ */
    #server-banner,
    #server-banner.visible {
      display: none !important;
    }
    #server-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: linear-gradient(90deg, #7c2020, #991b1b);
      color: #fca5a5;
      font-size: .8rem;
      font-weight: 600;
      text-align: center;
      padding: 8px 20px;
      letter-spacing: .4px;
      border-bottom: 1px solid rgba(239, 68, 68, .3);
      animation: slideDown .3s ease;
    }

    #server-banner.visible {
      display: block;
    }

    #server-banner a {
      color: #fca5a5;
      text-decoration: underline;
      cursor: pointer;
    }

    /* ══════════════════════════════════════════════════════════
       HEADER
    ══════════════════════════════════════════════════════════ */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--grad-header);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #e94560, #ff6b81, #e94560);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
      user-select: none;
    }

    .header-logo-icon {
      font-size: 1.4rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(233, 69, 96, .5));
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: .72rem;
      font-weight: 500;
      color: #10b981;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      animation: live-dot 2s ease-in-out infinite;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-search-wrap {
      position: relative;
      width: 260px;
    }

    .header-search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: .85rem;
      pointer-events: none;
    }

    #windows-search {
      width: 100%;
      padding: 9px 16px 9px 38px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text);
      font-family: inherit;
      font-size: .85rem;
      outline: none;
      transition: var(--transition-base);
    }

    #windows-search::placeholder {
      color: var(--muted);
    }

    #windows-search:focus {
      border-color: var(--accent);
      background: var(--glass2);
      box-shadow: 0 0 0 3px rgba(233, 69, 96, .1);
    }

    /* Server indicator pill */
    #server-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--glass);
      cursor: default;
      transition: var(--transition-base);
    }

    #server-indicator .si-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4a5568;
      transition: var(--transition-base);
    }

    #server-indicator.online {
      color: #34d399;
      border-color: rgba(16, 185, 129, .25);
      background: rgba(16, 185, 129, .08);
    }

    #server-indicator.online .si-dot {
      background: #10b981;
      animation: live-dot 2s ease-in-out infinite;
    }

    #server-indicator.offline {
      color: #f87171;
      border-color: rgba(239, 68, 68, .25);
      background: rgba(239, 68, 68, .08);
    }

    #server-indicator.offline .si-dot {
      background: #ef4444;
    }

    /* Hamburger button */
    #hamburger-btn {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--glass);
      cursor: pointer;
      transition: var(--transition-base);
      flex-shrink: 0;
    }

    #hamburger-btn:hover {
      background: var(--glass2);
      border-color: var(--border2);
    }

    #hamburger-btn span {
      display: block;
      width: 18px;
      height: 2px;
      background: var(--text2);
      border-radius: 2px;
      transition: var(--transition-base);
    }

    #hamburger-btn:hover span {
      background: var(--text);
    }

    /* Categories overlay & popup */
    #categories-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(4px);
      animation: fadeInUp .2s ease-out;
    }

    #categories-overlay.open {
      display: block;
    }

    #categories-popup {
      position: fixed;
      top: 72px;
      right: 32px;
      z-index: 501;
      width: 380px;
      max-height: calc(100vh - 100px);
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .04);
      display: none;
      flex-direction: column;
      animation: slideDown .25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #categories-popup.open {
      display: flex;
    }

    .cat-popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cat-popup-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .cat-popup-logo {
      font-size: 1.2rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(233, 69, 96, .6));
    }

    .cat-popup-close {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
    }

    .cat-popup-close:hover {
      background: rgba(239, 68, 68, .12);
      color: #f87171;
      border-color: rgba(239, 68, 68, .2);
    }

    .cat-popup-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .cat-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .cat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      background: var(--glass);
      border: 1px solid var(--border);
      font-size: .88rem;
      font-weight: 500;
      color: var(--text);
      animation: fadeInUp .25s ease-out both;
    }

    .cat-item-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-item-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .cat-item-del {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: .85rem;
      padding: 4px 6px;
      border-radius: var(--radius-sm);
      transition: var(--transition-fast);
    }

    .cat-item-del:hover {
      color: #f87171;
      background: rgba(239, 68, 68, .1);
    }

    .cat-add-row {
      display: flex;
      gap: 8px;
    }

    #new-category-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text);
      font-family: inherit;
      font-size: .88rem;
      outline: none;
      transition: var(--transition-base);
    }

    #new-category-input::placeholder {
      color: var(--muted);
    }

    #new-category-input:focus {
      border-color: var(--accent);
      background: var(--glass2);
      box-shadow: 0 0 0 3px rgba(233, 69, 96, .08);
    }

    #add-category-btn {
      padding: 10px 16px;
      background: var(--grad-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      transition: var(--transition-base);
      white-space: nowrap;
    }

    #add-category-btn:hover {
      box-shadow: 0 4px 14px rgba(233, 69, 96, .35);
      transform: translateY(-1px);
    }

    .cat-empty {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      padding: 20px 0;
    }

    /* ══════════════════════════════════════════════════════════
       TAB BAR
    ══════════════════════════════════════════════════════════ */
    #tab-bar {
      position: relative;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 10px 32px;
    }

    .tab-btn {
      position: relative;
      padding: 10px 22px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      color: var(--text2);
      cursor: pointer;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 500;
      letter-spacing: .3px;
      transition: var(--transition-base);
    }

    .tab-btn:hover {
      color: var(--text);
      background: var(--glass2);
      border-color: var(--border2);
    }

    .tab-btn.active {
      color: #fff;
      background: var(--grad-accent);
      border-color: transparent;
      box-shadow: 0 2px 12px rgba(233, 69, 96, .3);
    }

    /* ══════════════════════════════════════════════════════════
       MAIN
    ══════════════════════════════════════════════════════════ */
    #main {
      position: relative;
      z-index: 1;
      padding: 28px 32px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ══════════════════════════════════════════════════════════
       SHARED FORM ELEMENTS
    ══════════════════════════════════════════════════════════ */
    .form-section-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-grid .full-width {
      grid-column: 1/-1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text);
      font-family: inherit;
      font-size: .88rem;
      outline: none;
      width: 100%;
      transition: var(--transition-base);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--accent);
      background: var(--glass2);
      box-shadow: 0 0 0 3px rgba(233, 69, 96, .08);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--muted);
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-group select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .form-group select option {
      background: var(--bg2);
      color: var(--text);
    }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap input {
      padding-right: 42px;
    }

    .pw-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 1rem;
      padding: 0;
      transition: var(--transition-fast);
    }

    .pw-eye:hover {
      color: var(--text);
    }

    .btn-primary {
      padding: 10px 22px;
      background: var(--grad-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .3px;
      transition: var(--transition-base);
      white-space: nowrap;
    }

    .btn-primary:hover {
      box-shadow: 0 4px 16px rgba(233, 69, 96, .35);
      transform: translateY(-1px);
    }

    .btn-secondary {
      padding: 11px 24px;
      background: var(--glass);
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 500;
      transition: var(--transition-base);
    }

    .btn-secondary:hover {
      color: var(--text);
      border-color: var(--border2);
      background: var(--glass2);
    }

    .btn-save {
      padding: 11px 28px;
      background: var(--grad-success);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 600;
      letter-spacing: .3px;
      transition: var(--transition-base);
    }

    .btn-save:hover {
      box-shadow: 0 4px 16px rgba(16, 185, 129, .35);
      transform: translateY(-1px);
    }

    .form-actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    /* ══════════════════════════════════════════════════════════
       ADVERTISE WINDOW
    ══════════════════════════════════════════════════════════ */
    #advertise-window {
      display: none;
    }

    #advertise-window.visible {
      display: block;
      animation: fadeInUp .35s ease-out;
    }

    #advertise-tab-menu {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .advertise-tab-btn {
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--glass);
      color: var(--text2);
      cursor: pointer;
      font-family: inherit;
      font-size: .82rem;
      font-weight: 500;
      letter-spacing: .3px;
      transition: var(--transition-base);
    }

    .advertise-tab-btn:hover {
      color: var(--text);
      background: var(--glass2);
      border-color: var(--border2);
    }

    .advertise-tab-btn.active {
      color: #fff;
      background: rgba(233, 69, 96, .15);
      border-color: var(--accent);
    }

    #ad-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .ad-search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }

    .ad-search-wrap::before {
      content: '🔍';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: .8rem;
      pointer-events: none;
      z-index: 2;
    }

    #ad-search {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text);
      font-family: inherit;
      font-size: .88rem;
      outline: none;
      transition: var(--transition-base);
    }

    #ad-search::placeholder {
      color: var(--muted);
    }

    #ad-search:focus {
      border-color: var(--accent);
      background: var(--glass2);
      box-shadow: 0 0 0 3px rgba(233, 69, 96, .08);
    }

    #refresh-btn {
      padding: 10px 22px;
      background: var(--glass);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 500;
      transition: var(--transition-base);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat {

    .stat-value {

    }

    .no-ads-icon {

      margin-bottom: 16px;

    /* Analytics Table */
    #analytics-view {
      display: none;
    }

    #analytics-view.visible {
      display: block;
      animation: fadeInUp .35s ease-out;
    }

    .analytics-table-wrap {
      overflow-x: auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(12px);
    }

    .analytics-table {
      width: 100%;

    }

    .analytics-table th {
      background: rgba(233, 69, 96, .08);
      color: var(--text);
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .5px;

    .analytics-table td {

    .platform-chip {

    }

    }

    .chip-AdLandPro {

    }

    .chip-ClassifiedAds {

    }

    .views-count {

    .table-link {

    }

    /* Monthly scheduling calendar */
    #schedule-view {
      display: none;
    }

    #schedule-view.visible {
      display: flex;
      animation: fadeInUp .35s ease-out;
    }

    .schedule-calendar-shell { width:100%; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; }
    .schedule-calendar-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
    .schedule-calendar-header h3 { margin:0 0 4px; color:var(--text); font-size:1.1rem; }
    .schedule-calendar-header p { margin:0; color:var(--text2); font-size:.8rem; }
    .schedule-calendar-controls { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .schedule-calendar-controls select { min-width:100px; padding:8px 9px; border:1px solid var(--border2); border-radius:8px; background:var(--card2); color:var(--text); }
    .schedule-weekdays, .schedule-calendar-grid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:6px; }
    .schedule-weekdays { margin-bottom:6px; color:var(--text2); font-size:.68rem; font-weight:700; text-align:center; }
    .schedule-calendar-grid { min-height:420px; }
    .schedule-day { min-height:76px; padding:7px; border:1px solid var(--border); border-radius:8px; background:var(--card2); color:var(--text); cursor:pointer; text-align:left; transition:border-color .15s ease, background .15s ease, transform .15s ease; }
    .schedule-day:hover { border-color:var(--accent); background:var(--glass2); transform:translateY(-1px); }
    .schedule-day.is-outside { opacity:.42; }
    .schedule-day.is-today { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
    .schedule-day-number { display:block; font-weight:700; font-size:.76rem; }
    .schedule-day-events { display:flex; flex-direction:column; gap:3px; margin-top:7px; }
    .schedule-day-event { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:2px 4px; border-radius:4px; background:rgba(31,122,70,.12); color:var(--good); font-size:.58rem; }
    .schedule-items { display:flex; flex-direction:column; gap:6px; margin-top:16px; }
    .schedule-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:var(--card2); }
    .schedule-item-title { color:var(--text); font-size:.75rem; font-weight:700; }
    .schedule-item-meta { margin-top:2px; color:var(--text2); font-size:.68rem; }
    .schedule-item-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .schedule-item-edit, .schedule-item-delete { border:0; border-radius:6px; padding:5px 7px; cursor:pointer; font-size:.66rem; }
    .schedule-item-edit { background:rgba(31,122,70,.1); color:var(--good); }
    .schedule-item-delete { background:rgba(140,47,57,.1); color:var(--red); }
    .schedule-empty { padding:14px; border:1px dashed var(--border2); border-radius:8px; color:var(--text2); text-align:center; font-size:.75rem; }
    .schedule-dialog { position:fixed; inset:0; z-index:10020; display:grid; place-items:center; padding:18px; background:rgba(12,15,20,.6); }
    .schedule-dialog.hidden { display:none; }
    .schedule-dialog-card { width:min(480px, 100%); max-height:90vh; overflow:auto; padding:18px; border:1px solid var(--border2); border-radius:14px; background:var(--card); box-shadow:0 20px 60px rgba(0,0,0,.25); }
    .schedule-dialog-header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .schedule-dialog-header h3 { margin:0; color:var(--text); font-size:1rem; }
    .schedule-dialog-date { margin:8px 0 14px; color:var(--text2); font-size:.78rem; }
    #schedule-form { display:grid; gap:12px; }
    #schedule-form label { display:grid; gap:5px; color:var(--text2); font-size:.72rem; font-weight:600; }
    #schedule-form input, #schedule-form select { width:100%; padding:9px 10px; border:1px solid var(--border2); border-radius:8px; background:var(--card2); color:var(--text); }
    .schedule-product-picker { display:grid; gap:8px; }
    .schedule-product-picker-header { display:flex; justify-content:space-between; gap:10px; color:var(--text); font-size:.78rem; font-weight:700; }
    #schedule-selected-count { color:var(--accent); font-weight:700; }
    .schedule-product-picker-actions { display:flex; gap:12px; flex-wrap:wrap; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--card2); }
    .schedule-product-picker-actions label { display:flex !important; grid-template-columns:none !important; align-items:center; gap:6px; color:var(--text2); font-size:.72rem; font-weight:600; cursor:pointer; }
    .schedule-product-picker-actions input { width:auto !important; margin:0; accent-color:var(--accent); }
    .schedule-product-list { display:grid; gap:6px; max-height:250px; overflow:auto; padding:6px; border:1px solid var(--border2); border-radius:8px; background:var(--card2); }
    .schedule-product-option { display:flex; align-items:flex-start; gap:8px; padding:8px; border-radius:6px; cursor:pointer; }
    .schedule-product-option:hover, .schedule-product-option.is-selected { background:var(--glass2); }
    .schedule-product-option input { width:auto !important; margin-top:2px; accent-color:var(--accent); }
    .schedule-product-option-copy { min-width:0; display:grid; gap:2px; }
    .schedule-product-option-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); font-size:.74rem; font-weight:700; }
    .schedule-product-option-meta { color:var(--text2); font-size:.66rem; }
    .schedule-product-empty { padding:16px 8px; color:var(--text2); font-size:.75rem; text-align:center; }
    .schedule-platform-picker { display:grid; gap:8px; }
    .schedule-platform-picker-header { display:flex; justify-content:space-between; gap:10px; color:var(--text); font-size:.78rem; font-weight:700; }
    #schedule-platform-count { color:var(--accent); font-weight:700; }
    .schedule-platform-actions { display:flex; gap:12px; flex-wrap:wrap; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--card2); }
    .schedule-platform-actions label { display:flex !important; grid-template-columns:none !important; align-items:center; gap:6px; color:var(--text2); font-size:.72rem; font-weight:600; cursor:pointer; }
    .schedule-platform-actions input { width:auto !important; margin:0; accent-color:var(--accent); }
    #schedule-platform-list { display:block !important; max-height:190px; overflow-y:auto; padding:6px; border:1px solid var(--border2); border-radius:8px; background:var(--card2); }
    .schedule-platform-option { display:grid !important; grid-template-columns:auto minmax(0, 1fr) !important; align-items:center; gap:8px; min-height:40px; padding:7px 8px; border-radius:6px; color:var(--text2); font-size:.72rem; cursor:pointer; }
    .schedule-platform-option:hover, .schedule-platform-option.is-selected { background:var(--glass2); color:var(--text); }
    .schedule-platform-option input { width:auto !important; margin:0; accent-color:var(--accent); }
    .schedule-platform-option-name { color:var(--text); font-weight:700; }
    .schedule-location-picker { display:grid; gap:8px; }
    .schedule-location-picker-header { display:flex; justify-content:space-between; gap:10px; color:var(--text); font-size:.78rem; font-weight:700; }
    #schedule-location-count { color:var(--accent); font-weight:700; }
    .schedule-location-actions { display:flex; gap:12px; flex-wrap:wrap; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--card2); }
    .schedule-location-actions label { display:flex !important; grid-template-columns:none !important; align-items:center; gap:6px; color:var(--text2); font-size:.72rem; font-weight:600; cursor:pointer; }
    .schedule-location-actions input { width:auto !important; margin:0; accent-color:var(--accent); }
    #schedule-location-state-list { display:block !important; max-height:250px; overflow-y:auto; padding:6px; border:1px solid var(--border2); border-radius:8px; background:var(--card2); }
    .schedule-location-state { display:block !important; height:auto !important; min-height:44px; margin-bottom:6px; border:1px solid var(--border); border-radius:7px; overflow:visible; background:rgba(255,255,255,.28); }
    .schedule-location-state-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; border-bottom:1px solid var(--border); color:var(--accent); font-size:.72rem; font-weight:800; }
    .schedule-location-state-title { min-width:0; overflow-wrap:anywhere; }
    .schedule-location-state-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:var(--text2); font-size:.64rem; font-weight:600; }
    .schedule-location-state-actions label { display:inline-flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap; }
    .schedule-location-state-actions input { width:auto !important; margin:0; accent-color:var(--accent); }
    .schedule-location-city-list { display:block !important; padding:6px; }
    .schedule-location-option { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; color:var(--text2); font-size:.7rem; cursor:pointer; }
    #schedule-form .schedule-location-option { display:grid !important; grid-template-columns:auto minmax(0, 1fr) !important; align-items:center; gap:8px; min-width:0; min-height:44px; }
    .schedule-location-option:hover, .schedule-location-option.is-selected { background:var(--glass2); color:var(--text); }
    .schedule-location-option input { width:auto !important; margin:0; accent-color:var(--accent); }
    .schedule-location-copy { display:grid; grid-template-columns:minmax(0, 1fr) auto; align-items:baseline; gap:2px 8px; min-width:0; color:var(--text); }
    .schedule-location-city { min-width:0; overflow-wrap:anywhere; font-weight:700; }
    .schedule-location-state-name { min-width:0; overflow-wrap:anywhere; color:var(--text2); font-size:.66rem; font-weight:600; }
    .schedule-location-zip { white-space:nowrap; color:var(--muted); font-variant-numeric:tabular-nums; }
    .schedule-location-empty { padding:12px 8px; color:var(--text2); font-size:.72rem; text-align:center; }
    .schedule-dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);

      transition: var(--transition-base);

      color: var(--green)
    }

      color: var(--red)
    }

    .condition-like-new {
      background: rgba(59, 130, 246, .12);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, .2);
    }

    .condition-good {
      background: rgba(245, 158, 11, .12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, .2);
    }

    .condition-fair {
      background: rgba(239, 68, 68, .12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, .2);
    }

    .product-delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: .9rem;
      padding: 4px;
      border-radius: var(--radius-sm);
      transition: var(--transition-fast);
    }

    .product-delete-btn:hover {
      color: #f87171;
      background: rgba(239, 68, 68, .1);
    }

    /* FIX 1: Add missing CSS for product card checkbox immediately after .product-delete-btn:hover */
    .product-card-check {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 4;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
    }

    .product-card-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .product-card-selected {
      border-color: var(--accent) !important;
      background: rgba(233, 69, 96, 0.06) !important;
    }

    .empty-state {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: .4;
    }

    .empty-state p {
      font-size: .9rem;
    }

    /* ══════════════════════════════════════════════════════════
       ADD PRODUCT WINDOW
    ══════════════════════════════════════════════════════════ */
    #add-product-window {
      display: none;
    }

    #add-product-window.visible {
      display: block;
      animation: fadeInUp .35s ease-out;
    }

    .upload-zone {
      border: 2px dashed var(--border2);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition-base);
      background: var(--glass);
    }

    .upload-zone:hover {
      border-color: var(--accent);
      background: rgba(233, 69, 96, .05);
    }

    .upload-zone-icon {
      font-size: 1.8rem;
      margin-bottom: 8px;
      opacity: .5;
    }

    .upload-zone-text {
      font-size: .82rem;
      color: var(--text2);
    }

    .upload-zone-hint {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .upload-zone input[type="file"] {
      display: none;
    }

    .image-previews {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .image-previews img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      transition: var(--transition-fast);
    }

    .image-previews img:hover {
      border-color: var(--accent);
      transform: scale(1.05);
    }

    .specs-fieldset {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-top: 8px;
      background: var(--glass);
    }

    .specs-fieldset legend {
      padding: 0 10px;
      font-size: .78rem;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* ══════════════════════════════════════════════════════════
       ACCOUNTS WINDOW (MULTI-ACCOUNT REDESIGN)
    ══════════════════════════════════════════════════════════ */
    #accounts-window {
      display: none;
    }

    #accounts-window.visible {
      display: block;
      animation: fadeInUp .35s ease-out;
    }

    .accounts-grid {
      display: grid;
      gap: 20px;
    }

    .account-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      backdrop-filter: blur(12px);
      transition: var(--transition-base);
      animation: fadeInUp .4s ease-out both;
    }

    .account-card:hover {
      border-color: var(--border2);
    }

    .account-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .account-card-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .account-platform-badge {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .badge-cl {
      background: rgba(168, 85, 247, .15);
      color: var(--cl);
    }

    .badge-ap {
      background: rgba(59, 130, 246, .15);
      color: var(--ap);
    }

    .badge-ca {
      background: rgba(245, 158, 11, .15);
      color: var(--ca);
    }

    .badge-key {
      background: rgba(233, 69, 96, .15);
      color: var(--accent);
    }

    .badge-fb { background: rgba(24, 119, 242, .15); color: #1877f2; }
    .badge-ou { background: rgba(8, 127, 91, .15); color: #087f5b; }
    .badge-me { background: rgba(180, 35, 90, .15); color: #b4235a; }
    .badge-pm { background: rgba(157, 23, 77, .15); color: #9d174d; }
    .badge-nd { background: rgba(52, 122, 60, .15); color: #347a3c; }

    .account-status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
    }

    .status-saved {
      background: rgba(16, 185, 129, .12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, .2);
    }

    .status-unsaved {
      background: rgba(139, 149, 165, .1);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .status-saved .status-dot {
      background: #10b981;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .status-unsaved .status-dot {
      background: var(--muted);
    }

    .account-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .account-fields .full-width {
      grid-column: 1/-1;
    }

    @media(max-width:600px) {
      .account-fields {
        grid-template-columns: 1fr;
      }
    }

    .account-card-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-save-account {
      padding: 9px 22px;
      background: var(--grad-success);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      transition: var(--transition-base);
    }

    .btn-save-account:hover {
      box-shadow: 0 4px 14px rgba(16, 185, 129, .3);
      transform: translateY(-1px);
    }

    .btn-test {
      padding: 9px 20px;
      background: var(--glass);
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 500;
      transition: var(--transition-base);
    }

    .btn-test:hover {
      color: var(--text);
      border-color: var(--border2);
      background: var(--glass2);
    }

    .btn-clear-account {
      padding: 9px 20px;
      background: rgba(239, 68, 68, .08);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, .2);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 500;
      transition: var(--transition-base);
      margin-left: auto;
    }

    .btn-clear-account:hover {
      background: rgba(239, 68, 68, .15);
      border-color: rgba(239, 68, 68, .35);
    }

    .account-save-toast {
      font-size: .8rem;
      color: #34d399;
      opacity: 0;
      transition: opacity .3s;
      font-weight: 500;
    }

    .account-save-toast.show {
      opacity: 1;
    }

    /* Account Row In Accounts Tab */
    .account-row {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border);
      border-left: 4px solid var(--muted);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 14px;
      transition: var(--transition-base);
    }

    .account-row.platform-craigslist {
      border-left-color: var(--cl);
    }

    .account-row.platform-adlandpro {
      border-left-color: var(--ap);
    }

    .account-row.platform-classifiedads {
      border-left-color: var(--ca);
    }

    .account-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .account-label-input {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      padding: 4px 8px;
      outline: none;
      transition: var(--transition-fast);
      width: 180px;
    }

    .account-label-input:focus {
      border-color: var(--accent);
      width: 240px;
      background: var(--glass);
    }

    .account-row-status {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
    }

    .account-row-status.status-saved {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .account-row-status.status-unsaved {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.15);
    }

    .account-row-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .btn-clear-account:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-cl-login {
      padding: 9px 20px;
      background: rgba(168, 85, 247, .10);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, .25);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      transition: var(--transition-base);
    }

    .btn-cl-login:hover {
      background: rgba(168, 85, 247, .20);
      border-color: rgba(168, 85, 247, .45);
      box-shadow: 0 4px 14px rgba(168, 85, 247, .15);
      transform: translateY(-1px);
    }

    .btn-cl-login:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-cl-login-done {
      padding: 9px 20px;
      background: rgba(16, 185, 129, .10);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, .25);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      transition: var(--transition-base);
      animation: fadeInUp .3s ease-out;
    }

    .btn-cl-login-done:hover {
      background: rgba(16, 185, 129, .20);
      border-color: rgba(16, 185, 129, .45);
      box-shadow: 0 4px 14px rgba(16, 185, 129, .15);
      transform: translateY(-1px);
    }

    .cl-login-status {
      font-size: .78rem;
      color: var(--text2);
      font-weight: 500;
      transition: opacity .3s;
      animation: fadeInUp .3s ease-out;
    }

    .btn-cl-continue {
      padding: 9px 20px;
      background: rgba(75, 46, 131, .18);
      color: #a78bfa;
      border: 1px solid rgba(124, 58, 237, .40);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      transition: var(--transition-base);
    }

    .btn-cl-continue:hover {
      background: rgba(124, 58, 237, .30);
      border-color: rgba(124, 58, 237, .65);
      box-shadow: 0 4px 14px rgba(124, 58, 237, .20);
      transform: translateY(-1px);
    }

    .btn-cl-continue:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    .cl-login-status.success {
      color: #34d399;
    }

    /* ══════════════════════════════════════════════════════════
       POST WINDOW
    ══════════════════════════════════════════════════════════ */
    #post-window {
      display: none;
    }

    #post-window.visible {
      display: block;
      animation: fadeInUp .35s ease-out;
    }

    .post-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media(max-width:900px) {
      .post-layout {
        grid-template-columns: 1fr;
      }
    }

    .post-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      backdrop-filter: blur(12px);
    }

    .post-panel-title {
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text2);
      margin-bottom: 14px;
    }

    /* Product Selector */
    .product-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .product-selector::-webkit-scrollbar {
      width: 4px;
    }

    .product-selector::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .1);
      border-radius: 2px;
    }

    .product-checkbox-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--glass);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .product-checkbox-item:hover {
      background: var(--glass2);
      border-color: var(--border2);
    }

    .product-checkbox-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .product-checkbox-label {
      font-size: .84rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .product-checkbox-meta {
      font-size: .72rem;
      color: var(--text2);
      margin-top: 2px;
    }

    /* Redesigned Platform & Account Selectors */
    .platform-select-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      overflow: hidden;
      transition: var(--transition-base);
    }

    .platform-select-card.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .platform-select-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid var(--border);
    }

    .platform-select-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .platform-expand-arrow {
      font-size: .7rem;
      color: var(--text2);
      transition: transform 0.2s;
    }

    .platform-toggle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .platform-toggle-dot.pt-cl {
      background: var(--cl);
    }

    .platform-toggle-dot.pt-ap {
      background: var(--ap);
    }

    .platform-toggle-dot.pt-ca {
      background: var(--ca);
    }

    .platform-select-name {
      font-weight: 700;
      font-size: .88rem;
      color: var(--text);
    }

    .platform-select-no-creds {
      font-size: .75rem;
      color: var(--muted);
    }

    .platform-select-header-right {
      display: flex;
      gap: 8px;
    }

    .btn-ghost-small {
      padding: 4px 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text2);
      font-size: .72rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .btn-ghost-small:hover {
      color: var(--text);
      border-color: var(--border2);
      background: var(--glass);
    }

    .platform-accounts-list {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .post-account-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition-fast);
      font-size: .84rem;
    }

    .post-account-row:hover {
      background: var(--glass2);
      border-color: var(--border2);
    }

    .post-account-row.checked {
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--border2);
    }

    .post-account-row.checked.plat-craigslist {
      border-left-color: var(--cl);
    }

    .post-account-row.checked.plat-adlandpro {
      border-left-color: var(--ap);
    }

    .post-account-row.checked.plat-classifiedads {
      border-left-color: var(--ca);
    }

    .post-account-cb {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .post-account-label {
      font-weight: 600;
      color: var(--text);
    }

    .post-account-email {
      color: var(--text2);
      font-size: .78rem;
    }

    /* Launch Button */
    .btn-launch {
      width: 100%;
      margin-top: 20px;
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--grad-accent);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
      transition: var(--transition-base);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-launch:hover:not(:disabled) {
      box-shadow: 0 4px 20px rgba(233, 69, 96, .4);
      transform: translateY(-2px);
    }

    .btn-launch:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }

    /* ══════════════════════════════════════════════════════════
       PROGRESS SECTION
    ══════════════════════════════════════════════════════════ */
    .progress-section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      backdrop-filter: blur(12px);
      margin-bottom: 20px;
      animation: fadeInUp 0.3s ease;
    }

    .progress-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-weight: 700;
      font-size: .88rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .progress-job-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .job-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-left: 4px solid var(--muted);
      border-radius: var(--radius-md);
      font-size: .82rem;
      transition: var(--transition-base);
    }

    .job-row.status-pending {
      border-left-color: var(--muted);
    }

    .job-row.status-running {
      border-left-color: var(--ca);
      background: rgba(245, 158, 11, 0.05);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.05);
    }

    .job-row.status-done {
      border-left-color: var(--green);
      background: rgba(16, 185, 129, 0.03);
    }

    .job-row.status-error {
      border-left-color: var(--red);
      background: rgba(239, 68, 68, 0.03);
    }

    .job-row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .job-status-dot {
      font-size: 1rem;
    }

    .job-row-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      color: var(--text2);
    }

    .progress-overall-bar-wrap {
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .progress-overall-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: .75rem;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--glass2);
      border-radius: var(--radius-pill);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #a855f7, #3b82f6);
      border-radius: var(--radius-pill);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-bar-remaining {
      font-size: .75rem;
      color: var(--text2);
      text-align: right;
      font-weight: 500;

    /* ══════════════════════════════════════════════════════════
       LOG PANEL
    ══════════════════════════════════════════════════════════ */
    .log-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);

    .log-header-left {

      align-items: center;
      gap: 10px;
    }

    .log-title {

      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--text2);
    }

    .log-status-badge {

      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
    }

    .log-status-idle {
      background: rgba(139, 149, 165, .1);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .log-status-running {
      background: rgba(59, 130, 246, .12);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, .25);
    }

    .log-status-done {
      background: rgba(16, 185, 129, .12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, .25);
    }

    .log-status-error {
      background: rgba(239, 68, 68, .12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, .25);
    }

    .log-kill-btn {
      padding: 5px 14px;
      background: rgba(239, 68, 68, .1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, .2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      font-size: .75rem;
      font-weight: 600;
      transition: var(--transition-fast);
      display: none;
    }

    .log-kill-btn.visible {
      display: block;
    }

    .log-kill-btn:hover {
      background: rgba(239, 68, 68, .2);
    }

    #log-output {
      height: 420px;
      overflow-y: auto;
      padding: 16px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      line-height: 1.7;
      color: #8b95a5;
      background: rgba(0, 0, 0, .15);
    }

    #log-output::-webkit-scrollbar {
      width: 4px;
    }

    #log-output::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .1);
      border-radius: 2px;
    }

    .log-line {
      display: block;
      word-break: break-all;
    }

    .log-line.log-success {
      color: #34d399;
    }

    .log-line.log-error {
      color: #f87171;
    }

    .log-line.log-warn {
      color: #fbbf24;
    }

    .log-line.log-system {
      color: #60a5fa;
    }

    .log-line.log-done {
      color: #a855f7;
      font-weight: 600;
    }

    .log-placeholder {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: .85rem;
    }

    .log-placeholder-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: .3;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9000;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: .85rem;
      font-weight: 600;
      color: #fff;
      display: none;
      animation: slideDown .3s ease;

      box-shadow: var(--shadow-lg);

    #toast.show {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toast.toast-success {
      background: linear-gradient(135deg, #059669, #10b981);
    }

    #toast.toast-error {
      background: linear-gradient(135deg, #dc2626, #ef4444);
    }

    #toast.toast-info {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
    }

    /* Responsive */
    @media(max-width:768px) {
      header {
        padding: 0 16px;
      }

      .header-search-wrap {
        width: 180px;
      }

      #tab-bar {

      }

      }

      }

      .post-layout {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width:480px) {
      .header-search-wrap {
        display: none;
      }

      .stats-bar {
        grid-template-columns: 1fr;
      }

      .header-status {
        display: none;
      }
    }

    /* ═══════════════════════════════════════════════════════════
       BONDS MALL THEME OVERRIDE
       Shared visual language with bondsmall.css: warm ivory canvas,

    :root {

      --card: #fffdf8;

      --text: #1c1b1a;

      --ca: #9a6a1f;
      --ca-glow: rgba(154, 106, 31, .14);

    /* Bonds Mall seller header */
    .bm-seller-header { position:sticky; top:0; z-index:20; display:grid; grid-template-columns:minmax(260px,1fr) minmax(240px,540px) minmax(260px,1fr); align-items:center; gap:1rem; min-height:76px; padding: .85rem clamp(1rem,3vw,2rem); background:rgba(255,253,248,.96) !important; border-bottom:1px solid #d4c8b9 !important; box-shadow:0 4px 18px rgba(57,43,29,.06); backdrop-filter:blur(8px); }

    .bm-search-wrap .header-search-icon { position:absolute; left:.85rem; top:50%; transform:translateY(-50%); color:#9e958b; font-size:1.1rem; z-index:1; }
    .bm-system-status { display:flex; align-items:center; gap:6px; color:#1f7a46; font-size:.74rem; white-space:nowrap; }

    /* Responsive Bonds Mall refinement: fit the page to the viewport. */

      max-width: 100%;

    }

    .platform-session-window {

    .platform-session-window[data-platform="adlandpro"] { right: calc(33.333vw + 24px); bottom: 12px; }

    .platform-session-titlebar .session-title { flex: 1; }
    .platform-session-titlebar button {

    .platform-session-view {

      padding: 4px;
      color: var(--text2);

    .session-listing-workflow { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .session-workflow-title { color:var(--text); font-weight:700; font-size:.76rem; }
    .session-workflow-note { color:var(--text2); font-size:.66rem; line-height:1.25; }
    .session-listing-card { padding:6px; border:1px solid var(--border); border-radius:7px; background:#fff; }
    .session-listing-card-head { display:flex; align-items:center; gap:5px; justify-content:space-between; color:var(--text); font-size:.68rem; }
    .session-listing-card-head strong { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .session-listing-meta { margin-top:3px; color:var(--text2); font-size:.64rem; }
    .session-listing-card textarea { width:100%; min-height:58px; max-height:88px; margin-top:4px; padding:4px; resize:vertical; box-sizing:border-box; border:1px solid var(--border); border-radius:5px; background:#faf8f2; color:var(--text); font: .62rem/1.25 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .session-copy-btn, .session-posted-btn, .session-skip-btn { border:0; border-radius:5px; padding:4px 6px; cursor:pointer; font-size:.64rem; white-space:nowrap; }
    .session-copy-btn { background:#eee8df; color:var(--text); }
    .session-signout-btn { min-height:25px; padding:4px 6px; border:1px solid #d7a8a2; border-radius:5px; color:#8c2f39; background:#fff7f5; font-size:.7rem; cursor:pointer; }
    .session-captcha-btn { background:#7f1d1d; color:#fff; border:1px solid #ef4444; border-radius:5px; padding:4px 6px; cursor:pointer; font-size:.64rem; white-space:nowrap; }
    .session-posted-btn { background:#1f7a46; color:#fff; }
    .session-skip-btn { background:#f3e3e1; color:#8c2f39; }
    .session-workflow-actions { display:flex; gap:5px; flex-wrap:wrap; }
    .session-selector-results { margin-top:6px; padding:6px; border:1px solid #c9d5df; border-radius:7px; background:#f7fbff; }
    .selector-result-group { margin-top:6px; }

    .selector-result-grid { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); gap:3px 6px; align-items:start; }
    .selector-result-grid code { overflow-wrap:anywhere; color:#255b7a; font-size:.58rem; }
    .selector-result-grid span, .selector-result-grid em { color:var(--text2); font-size:.6rem; }
    .craigslist-flow-steps { margin:0; padding-left:18px; color:var(--text2); font-size:.64rem; line-height:1.4; }
    .craigslist-flow-steps code { color:#255b7a; font-size:.58rem; overflow-wrap:anywhere; }
    .post-account-connection { margin-left:auto; color:#8c2f39; font-size:.68rem; white-space:nowrap; }
    .post-account-connection:has(+ *) { }

    @media (max-width: 900px) {
      .platform-session-window { width: min(92vw, 420px); height: 20vh; min-height: 150px; }
      .platform-session-window[data-platform="craigslist"],

      .platform-session-window[data-platform="classifiedads"] { right: 4vw; bottom: 10px; }
    }
    @media (max-width: 600px) {
      #mini-browser { inset: 8px; border-radius: 12px; }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, .2);
    }

    /* select all / deselect all buttons in toolbar */
    #select-all-products,
    #deselect-all-products {
      padding: 9px 16px;
      font-size: .82rem;
      white-space: nowrap;
    }

    /* selected count badge */
    #product-selected-count {
      display: none;
      align-items: center;
      padding: 4px 12px;
      border-radius: 50px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--ca);
      border: 1px solid rgba(245, 158, 11, 0.25);
      font-size: .75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    #product-selected-count.visible {
      display: flex;
    }

    /* --- NEW AI + MODAL STYLES --- */
    .spec-label {
      font-weight: 600;
    }

    .spec-value {
      font-weight: 400;
    }

    /* ══════════════════════════════════════════════════════════
       LOCATION MANAGER STYLES
    ══════════════════════════════════════════════════════════ */
    .location-manager {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--glass);
      padding: 14px;
      margin-top: 4px;
    }

    .location-manager-title {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--cl);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .location-fields-row {
      display: grid;
      grid-template-columns: 1fr 1.5fr 100px;
      gap: 8px;
      margin-bottom: 10px;
    }

    .location-fields-row input {
      padding: 9px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, .2);

      font-family: inherit;
      font-size: .84rem;
      outline: none;
      transition: var(--transition-base);
      width: 100%;
    }

    .location-fields-row input:focus {
      border-color: var(--cl);
      background: rgba(168, 85, 247, .05);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, .1);
    }

    .location-fields-row input::placeholder {
      color: var(--muted);
    }

    .btn-add-location {
      padding: 9px 14px;
      background: rgba(168, 85, 247, .15);

      border: 1px solid rgba(168, 85, 247, .3);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: .82rem;
      font-weight: 600;
      transition: var(--transition-base);
      white-space: nowrap;
    }

    .btn-add-location:hover {
      background: rgba(168, 85, 247, .25);
      border-color: rgba(168, 85, 247, .5);
    }

    .saved-locations-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 4px;
    }

    .saved-locations-list:empty::after {
      content: 'No locations saved yet. Add one above.';
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      padding: 10px 0;
    }

    .location-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, .15);
      border: 1px solid var(--border);
      gap: 10px;
      animation: fadeInUp .2s ease-out;
    }

    .location-item.selected {
      border-color: var(--cl);
      background: rgba(168, 85, 247, .08);
    }

    .location-item-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      cursor: pointer;
      flex: 1;
    }

    .location-item-main {
      font-size: .83rem;
      font-weight: 600;
      color: var(--text);
    }

    .location-item-sub {
      font-size: .72rem;
      color: var(--text2);
    }

    .location-item-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-loc-select {
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--cl);
      background: transparent;
      color: var(--cl);
      font-size: .72rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .btn-loc-select:hover,
    .location-item.selected .btn-loc-select {
      background: var(--cl);
      color: #fff;
    }

    .btn-loc-del {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: .85rem;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      transition: var(--transition-fast);
    }

    .btn-loc-del:hover {
      color: #f87171;
      background: rgba(239, 68, 68, .1);
    }

    .location-badge-active {
      font-size: .68rem;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: rgba(168, 85, 247, .15);
      color: var(--cl);
      border: 1px solid rgba(168, 85, 247, .25);
      font-weight: 600;
      white-space: nowrap;
    }

    #product-preview-overlay,
    #search-results-overlay,
    .ai-card-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }

    #product-preview-modal,
    #search-results-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 901;
      width: 800px;
      max-width: 90vw;
      max-height: 90vh;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-lg);
      flex-direction: column;
      overflow: hidden;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      position: relative;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
      position: sticky;
      bottom: 0;
      justify-content: flex-end;
    }

    .ai-card-overlay {
      position: absolute;
      z-index: 10;
      border-radius: var(--radius-lg);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .ai-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.2);

    }

    .ai-error-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--red);
      color: #fff;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 12px;
      cursor: pointer;
      display: none;
      z-index: 11;
    }

    .card-menu-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 5;
    }

    .card-menu-dropdown {
      position: absolute;
      top: 40px;
      right: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      display: none;
      flex-direction: column;
      z-index: 11;
    }

    .card-menu-dropdown button {
      background: none;
      border: none;
      color: var(--text);
      padding: 8px 16px;
      text-align: left;
      cursor: pointer;
      width: 100%;
    }

    .card-menu-dropdown button:hover {
      background: var(--glass2);
    }

    .catalog-pager { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:12px 0 4px; padding:10px 0; color:var(--text2); font-size:.76rem; }
    .catalog-pager-summary { flex:1 1 260px; }
    .catalog-pager-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .catalog-pager-actions .btn-secondary { padding:6px 10px; }
    .catalog-pager-actions button:disabled { opacity:.45; cursor:not-allowed; }
    .editable-field {
      cursor: pointer;
      border-bottom: 1px dashed var(--muted);
    }

    .editable-field:hover {
      border-bottom-color: var(--accent);
    }

    .captcha-notification-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    #captcha-notification-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 38px;
      padding: 0 11px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor: pointer;
      font-size: 1.05rem;
      transition: var(--transition-fast);
    }
    #captcha-notification-button:hover,
    #captcha-notification-button:focus-visible,
    #captcha-notification-button.has-alert {
      border-color: #ef4444;
      color: #fecaca;
      background: rgba(239,68,68,.12);
      outline: none;
    }
    #captcha-notification-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      display: none;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 2px solid var(--bg1);
      border-radius: 50%;
      background: #ef4444;
      color: #fff;
      font-size: .68rem;
      font-weight: 800;
      line-height: 1;
      box-shadow: 0 3px 12px rgba(239,68,68,.45);
    }
    #captcha-notification-badge.visible { display: inline-flex; }
    #captcha-notification-popup {
      position: fixed;
      top: 76px;
      right: 22px;
      z-index: 9500;
      display: none;
      width: min(380px, calc(100vw - 32px));
      max-height: min(70vh, 520px);
      overflow: hidden;
      flex-direction: column;
      background: var(--bg2);
      border: 1px solid rgba(239,68,68,.45);
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 55px rgba(0,0,0,.45);
    }
    #captcha-notification-popup.open { display: flex; }
    .captcha-notification-popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .captcha-notification-popup-header strong { color: #fecaca; }
    .captcha-notification-close {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.05rem;
      line-height: 1;
    }
    #captcha-notification-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      overflow-y: auto;
    }
    .captcha-notification-item {
      display: grid;
      gap: 9px;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid rgba(239,68,68,.24);
      border-radius: var(--radius-md);
      background: rgba(239,68,68,.07);
      color: var(--text);
      text-align: left;
    }
    .captcha-notification-item:hover,
    .captcha-notification-item:focus-within {
      border-color: #ef4444;
      background: rgba(239,68,68,.14);
      outline: none;
    }
    .captcha-notification-item-copy { min-width: 0; cursor: pointer; }
    .captcha-notification-item-title { display: block; font-weight: 700; font-size: .82rem; }
    .captcha-notification-item-meta { display: block; margin-top: 3px; color: var(--muted); font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .captcha-notification-product { display:block; margin-top:4px; color:var(--text); font-size:.72rem; line-height:1.35; }
    .captcha-notification-location { display:block; margin-top:3px; color:#fecaca; font-size:.68rem; }
    .captcha-notification-body { display:grid; grid-template-columns:86px minmax(0,1fr); gap:10px; align-items:start; }
    .captcha-notification-screenshot { display:flex; align-items:center; justify-content:center; width:86px; height:58px; overflow:hidden; border:1px solid rgba(239,68,68,.35); border-radius:6px; background:#fff; color:var(--muted); font-size:.58rem; text-align:center; }
    .captcha-notification-screenshot img { display:block; width:100%; height:100%; object-fit:contain; }
    .captcha-notification-form { display:flex; gap:6px; align-items:center; }
    .captcha-notification-form input { flex:1 1 auto; min-width:0; height:30px; padding:0 8px; border:1px solid var(--border2); border-radius:6px; background:var(--card2); color:var(--text); font-size:.72rem; }
    .captcha-notification-form button { flex:0 0 auto; height:30px; padding:0 9px; border:1px solid #ef4444; border-radius:6px; background:#ef4444; color:#fff; cursor:pointer; font-size:.68rem; font-weight:700; }
    .captcha-notification-form button:hover { background:#dc2626; }
    .captcha-notification-note { color:var(--muted); font-size:.64rem; line-height:1.35; }
    .captcha-notification-empty { padding: 16px; color: var(--muted); font-size: .8rem; text-align: center; }
    .platform-session-window.captcha-required { border-color: rgba(239,68,68,.75); box-shadow: 0 0 0 2px rgba(239,68,68,.14), 0 16px 40px rgba(0,0,0,.35); }

    #toast-notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--green);
      color: #fff;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      z-index: 9999;
    }

    #toast-notification.show {
      opacity: 1;
    }

    .toast-notification.toast-error {
      background: #c0392b;
    }

    .toast-notification.toast-warn {
      background: #d68910;
    }

      const bulkStopBtn = document.getElementById('bulk-stop-btn');
      if (bulkStopBtn) bulkStopBtn.style.display = 'none';
    }
  </script>
