<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Emulator Paths</title><style>body{margin:0;background:#07120d;color:#edf7ef;font:14px system-ui;padding:20px}main{max-width:1100px;margin:auto}.control{background:#102019;border:1px solid #23402f;border-radius:12px;padding:14px;margin-bottom:16px;position:sticky;top:10px;z-index:2}.control select{padding:9px;border-radius:8px;background:#07120d;color:#fff;border:1px solid #3a6249}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#102019;border:1px solid #23402f;border-radius:12px;padding:14px}button{margin:4px;padding:8px 10px;border-radius:7px;border:1px solid #3a6249;background:#173424;color:#fff;cursor:pointer}.url{font-size:11px;color:#9aa0a6;word-break:break-all}.profile{color:#c7d2fe;margin-top:8px}</style></head><body><main><h1>Android Emulator Platform Paths</h1><p>Every button opens the selected platform's official sign-in or posting path inside the Android emulator. The selected Seller account determines the browser profile. Human users remain responsible for credentials, CAPTCHA/MFA, consent, and final submission.</p><section class="control"><label for="account"><strong>Seller Browser Account</strong></label> <select id="account"></select><div id="profile" class="profile"></div></section><div id="grid" class="grid"></div></main><script src="android-emulator-browser.js"></script><script src="seller-browser-account-profiles.js"></script><script src="platform-emulator-flow.js"></script><script>(function(){const a=document.getElementById('account'),p=document.getElementById('profile');window.BondsMallSellerBrowserAccounts.profiles().forEach(x=>{const o=document.createElement('option');o.value=x.accountNumber;o.textContent=`Account ${x.accountNumber} — ${x.browserType}`;a.appendChild(o);});a.value=window.BondsMallSellerBrowserAccounts.get().accountNumber;function paint(){const x=window.BondsMallSellerBrowserAccounts.get();a.value=x.accountNumber;p.textContent=`Account ${x.accountNumber} → ${x.browserType} (${x.engine})`; }a.onchange=()=>{window.BondsMallSellerBrowserAccounts.select(a.value);paint();};paint();const root=document.getElementById('grid');const paths=window.BondsMallPlatformEmulatorFlow.paths();Object.entries(paths).forEach(([name,x])=>{const c=document.createElement('section');c.className='card';c.innerHTML='<h2>'+name+'</h2><div class="url">Sign in: '+x.signIn+'</div><div class="url">Post: '+x.post+'</div><button data-kind="signIn">Open Sign In</button><button data-kind="post">Open Post</button>';c.querySelectorAll('button').forEach(b=>b.onclick=()=>window.BondsMallPlatformEmulatorFlow.open(name,b.dataset.kind));root.appendChild(c);});})();</script></body></html>
