<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonds Mall Mission Control</title><style>body{margin:0;background:#07120d;color:#edf7ef;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#102019;border:1px solid #23402f;border-radius:12px;padding:16px}.value{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:9px;border-bottom:1px solid #23402f;text-align:left}button{padding:10px 14px;border-radius:8px;border:1px solid #3a6249;background:#173424;color:#fff;cursor:pointer}</style></head><body><main><h1>Bonds Mall Mission Control</h1><p>Central operational view of mission, queue, publication, health and recovery state.</p><button id="refresh">Refresh</button><section class="grid"><div class="card"><small>Mission</small><div id="mission" class="value">—</div></div><div class="card"><small>Queued Jobs</small><div id="queued" class="value">0</div></div><div class="card"><small>Live Ads</small><div id="live" class="value">0</div></div><div class="card"><small>Health Failures</small><div id="health" class="value">0</div></div><div class="card"><small>Scheduler</small><div id="scheduler" class="value">0</div></div></section><table><thead><tr><th>Platform</th><th>Product</th><th>Location</th><th>Status</th><th>URL</th></tr></thead><tbody id="ads"></tbody></table></main><script src="mission-orchestrator.js"></script><script src="mission-job-queue.js"></script><script src="active-ads-registry.js"></script><script src="ad-health-monitor.js"></script><script src="mission-scheduler.js"></script><script>(function(){function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){const m=window.BondsMallMissionOrchestrator?.getState()||{},q=window.BondsMallMissionJobQueue?.list()||[],a=window.BondsMallActiveAdsRegistry?.list()||[],h=window.BondsMallAdHealthMonitor?.history()||[];document.getElementById('mission').textContent=m.status||'idle';document.getElementById('queued').textContent=q.filter(x=>!['published','cancelled'].includes(x.status)).length;document.getElementById('live').textContent=a.length;document.getElementById('health').textContent=h.filter(x=>!x.healthy).length;document.getElementById('scheduler').textContent=window.BondsMallMissionScheduler?.pending().length||0;document.getElementById('ads').innerHTML=a.map(x=>'<tr><td>'+esc(x.platform)+'</td><td>'+esc(x.product?.name||x.product?.title||x.product)+'</td><td>'+esc(x.location?.name||x.location?.city||x.location)+'</td><td>'+esc(x.status)+'</td><td><a href="'+esc(x.liveUrl)+'" target="_blank" rel="noopener">open</a></td></tr>').join('');}document.getElementById('refresh').onclick=render;render();window.addEventListener('bonds:active-ads-updated',render);window.addEventListener('bonds:mission-job',render);window.addEventListener('bonds:ad-health-result',render);})();</script></body></html>
